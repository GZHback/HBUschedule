name: Android

on:
  push:
    branches: [feat/android-app, main]
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'

      # runner 镜像默认只带到 android-36，Compose 1.12 与 AndroidX 1.19 要按 API 37 编译。
      # API 37 在 SDK 仓库里的包名带次版本号（platforms;android-37.0），
      # 这一步装不上也不拦后面 AGP 按 compileSdk 自行下载
      - name: 补装 android-37 平台
        continue-on-error: true
        run: |
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platforms;android-37.0"
          ls "$ANDROID_HOME/platforms" | tail -5

      # 仓库里不放 gradle-wrapper.jar，CI 直接装固定版本的 Gradle
      - name: 安装 Gradle
        run: |
          curl -sSLo "$RUNNER_TEMP/gradle.zip" \
            https://services.gradle.org/distributions/gradle-9.8.0-bin.zip
          unzip -q "$RUNNER_TEMP/gradle.zip" -d "$HOME/gradle"
          echo "$HOME/gradle/gradle-9.8.0/bin" >> "$GITHUB_PATH"

      - name: 打印环境
        run: |
          gradle --version
          echo "ANDROID_HOME=$ANDROID_HOME"
          ls "$ANDROID_HOME/platforms" || true

      - name: 单元测试
        run: gradle --no-daemon --stacktrace :app:testDebugUnitTest

      - name: 打 debug APK
        run: gradle --no-daemon --stacktrace :app:assembleDebug

      - uses: actions/upload-artifact@v4
        with:
          name: hbu-schedule-debug
          path: app/build/outputs/apk/debug/*.apk
